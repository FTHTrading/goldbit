version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: unykorn_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: unykorn_gold_db
      POSTGRES_USER: unykorn_admin
      POSTGRES_PASSWORD: unykorn_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unykorn_admin -d unykorn_gold_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: unykorn_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: unykorn_gold_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: "postgresql://unykorn_admin:unykorn_dev_password@postgres:5432/unykorn_gold_db?schema=public"
      REDIS_URL: "redis://redis:6379"

volumes:
  postgres_data:
  redis_data:
